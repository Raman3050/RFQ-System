# Included in every location: nginx doesn't inherit add_header into blocks that set their own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# MUI/Emotion inject <style> tags at runtime, hence 'unsafe-inline' for styles only.
# 'self' in connect-src also covers same-origin ws:/wss: in current browsers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
