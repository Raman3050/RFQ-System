map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api {
    server api:8000;
    keepalive 32;
    keepalive_timeout 60s;  # below uvicorn's --timeout-keep-alive 75
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health/ {
        proxy_pass http://api;
    }

    # Live auction updates. Server pings every 25s, so 75s idle is plenty.
    location = /ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Fingerprinted build assets: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: every other path serves index.html (never cached, so deploys take effect).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
