repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: backend/.venv/bin/ruff check --fix --config backend/pyproject.toml
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        entry: backend/.venv/bin/ruff format --config backend/pyproject.toml
        language: system
        types: [python]
        files: ^backend/
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write "${@#frontend/}"' --
        language: system
        files: ^frontend/src/.*\.(ts|tsx|css)$
