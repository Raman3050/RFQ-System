# Local development stack. Host ports are overridable via .env (see .env.example).
name: rfq-auction

x-backend-env: &backend-env
  ENVIRONMENT: local
  LOG_JSON: "false"
  DATABASE_URL: postgresql+asyncpg://rfq:rfq@postgres:5432/rfq_auction
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: '["http://localhost:5173"]'
  FRONTEND_BASE_URL: http://localhost:${FRONTEND_PORT:-5173}
  # Dev: every email is caught by Mailpit (UI on :8025), nothing leaves the machine.
  EMAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rfq
      POSTGRES_PASSWORD: rfq
      POSTGRES_DB: rfq_auction
      TZ: UTC
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq -d rfq_auction"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["${MAILPIT_UI_PORT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ./backend, target: dev }
    command: ["./scripts/start-api.sh"]
    environment: *backend-env
    ports: ["${API_PORT:-8080}:8000"]
    volumes: ["./backend/app:/app/app", "./backend/alembic:/app/alembic"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ./backend, target: dev }
    command: ["python", "-m", "app.workers.lifecycle"]
    environment: *backend-env
    volumes: ["./backend/app:/app/app"]
    depends_on:
      api: { condition: service_healthy }  # api runs migrations first

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports: ["${FRONTEND_PORT:-5173}:5173"]
    volumes: ["./frontend/src:/app/src"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
